# Test deployment on NeuBird's eks-htm-prod cluster: the proxy in front of
# the Splunk E2E instance's MCP server, with no APIM. The proxy checks
# NeuBird's token, strips it, and sends the Splunk MCP token upstream.
# Not a MetLife config: see deploy/config.example.yaml for that.

listen: ":8443"          # behind ingress-nginx, which terminates TLS
admin_listen: ":9090"

client_token_env: NEUBIRD_PROXY_TOKEN
max_body_bytes: 20971520

connections:
  - name: splunk
    upstream: https://splunk-e2e.tools.neubird.ai
    client_auth: bearer
    # MCP streamable HTTP: POST carries JSON-RPC, DELETE ends a session.
    # The server answers GET with 405, so GET is not allowed through.
    methods: [POST, DELETE]
    paths: [/services/mcp]
    headers:
      Authorization: Bearer ${SPLUNK_MCP_TOKEN}
    # SPL commands that write, send, delete or reach other systems, as
    # they would appear inside a tool call's arguments.
    request_deny_patterns:
      - "(?i)\\|\\s*(sendemail|sendalert|outputlookup|outputcsv|outputtext|collect|mcollect|meventcollect|tscollect|delete|script|run|runshellscript|map|dbxoutput|dbxquery|sendresults)\\b"
    # From tools/list on Splunk_MCP_Server 1.2.1. The user tools return
    # Splunk account data (names, emails, roles); emails are still masked.
    # Left out: splunk_run_saved_search, which runs SPL stored in Splunk,
    # where request_deny_patterns cannot see it.
    mcp_tools:
      - splunk_get_info
      - splunk_get_indexes
      - splunk_get_index_info
      - splunk_run_query
      - splunk_get_metadata
      - splunk_get_kv_store_collections
      - splunk_get_knowledge_objects
      - splunk_get_user_list
      - splunk_get_user_info
    rate_limit: {requests_per_second: 10, burst: 30}

redaction:
  # All default builtins.
  custom:
    - name: member_id
      regex: "\\bMET[0-9]{9}\\b"
  # HMAC tokens: the same value always maps to the same code, so the agent
  # can correlate events without seeing the value. Key from the Secret.
  mask: hmac
  hmac_key_env: REDACTION_HMAC_KEY

# Outbound tunnel to the test relay in neubird-relay-test (same cluster).
# The inbound listener stays on, so the public URL keeps working too.
tunnel:
  relays: ["neubird-relay.neubird-relay-test.svc:8443"]
  cert_file: /etc/neubird-proxy-tunnel/tls.crt
  key_file: /etc/neubird-proxy-tunnel/tls.key
  ca_file: /etc/neubird-proxy-tunnel/relay-ca.crt
  # Two tunnels per pod, so one relay replica restarting rarely leaves
  # the tenant without a tunnel.
  connections_per_relay: 2
