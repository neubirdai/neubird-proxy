# neubird-proxy configuration. Mounted from a ConfigMap; secrets are
# referenced by environment variable name and come from a Kubernetes Secret.
# Hostnames, API paths, allowlists and the member_id pattern are
# placeholders for MetLife to confirm against each connector's real calls.

listen: ":8443"          # NeuBird-facing listener (exposed via the load balancer)
admin_listen: ":9090"    # /healthz, /readyz, /metrics (cluster-internal only)

# Optional: terminate TLS in the pod. Omit if the load balancer terminates.
# With client_ca_file, NeuBird must also present a client certificate from
# that CA (mutual TLS), in addition to the token.
# tls:
#   cert_file: /etc/neubird-proxy/tls/tls.crt
#   key_file: /etc/neubird-proxy/tls/tls.key
#   client_ca_file: /etc/neubird-proxy/tls/neubird-client-ca.crt

# Optional: extra CA bundle for APIM's internal certificate.
# upstream_ca_file: /etc/neubird-proxy/ca/ca.crt

# Default token for connections that do not set their own (32+ characters).
client_token_env: NEUBIRD_PROXY_TOKEN
# During a rotation, the outgoing token is accepted too. Remove afterwards.
# client_token_previous_env: NEUBIRD_PROXY_TOKEN_PREVIOUS

max_body_bytes: 20971520      # 20 MiB; larger bodies are refused (502), never passed through
max_concurrent_requests: 256  # beyond this, 503
max_concurrent_buffered: 4    # and memory is budgeted from the container's limit (README: Latency and capacity)

upstream_defaults:
  headers:
    Ocp-Apim-Subscription-Key: ${APIM_SUBSCRIPTION_KEY}

connections:
  - name: splunk
    upstream: https://int.apis.metlife.com/splunk
    client_auth: bearer
    # Search jobs only: create (POST), poll and read results (GET).
    methods: [GET, POST]
    paths:
      - /services/search/(v2/)?jobs
      - /services/search/(v2/)?jobs/[A-Za-z0-9._-]+(/(results|events|results_preview|summary))?
      - /services/search/(v2/)?jobs/export
    # SPL commands that write, send, delete or reach other systems.
    request_deny_patterns:
      - "(?i)\\|\\s*(sendemail|sendalert|outputlookup|outputcsv|outputtext|collect|mcollect|meventcollect|tscollect|delete|script|run|runshellscript|map|rest|dbxoutput|dbxquery|sendresults)\\b"
    rate_limit: {requests_per_second: 5, burst: 20}

  - name: servicenow
    upstream: https://int.apis.metlife.com/servicenow
    client_auth: basic
    # A separate token, so a leak of one does not open the other.
    client_token_env: NEUBIRD_PROXY_TOKEN_SERVICENOW
    # Read-only (the default is GET, HEAD) and only the tables the agent needs.
    paths:
      - /api/now/table/(incident|problem|change_request|cmdb_ci[a-z_]*)(/[0-9a-f]{32})?
      - /api/now/stats/(incident|problem|change_request)
    # Only these JSON fields leave unmasked; every other string or number
    # becomes [REDACTED:FIELD], so free-text fields (description,
    # work_notes, comments) and people references stay inside MetLife.
    # Placeholder list: confirm against what the connector actually reads.
    response_fields:
      - result.sys_id
      - result.number
      - result.short_description
      - result.state
      - result.priority
      - result.impact
      - result.urgency
      - result.category
      - result.opened_at
      - result.resolved_at
      - result.sys_updated_on
      - result.cmdb_ci.display_value
      - result.assignment_group.display_value
      - result.stats
    rate_limit: {requests_per_second: 5, burst: 20}

  - name: maestro
    upstream: https://int.apis.metlife.com/maestro-mcp
    client_auth: bearer
    # MCP streamable HTTP: POST for JSON-RPC, GET for the SSE stream,
    # DELETE to end the session.
    methods: [GET, POST, DELETE]
    paths: [/mcp]
    # tools/call is refused for any tool not listed. Placeholder names.
    mcp_tools: [get_job_status, list_failed_jobs, get_job_log]
    rate_limit: {requests_per_second: 10, burst: 30}
  # Fallback for a connector that cannot take a base URL with a path:
  #   host: maestro.proxy.metlife.com
  # Backend not fronted by APIM: inject its credential from the Secret.
  #   upstream_basic_auth: {username_env: SN_USER, password_env: SN_PASSWORD}
  # Or, for a backend that takes OAuth tokens, get them with the client
  # credentials grant (see README, Upstream OAuth):
  #   upstream_oauth2:
  #     token_url: https://login.microsoftonline.com/<tenant>/oauth2/v2.0/token
  #     client_id_env: SN_CLIENT_ID
  #     client_secret_env: SN_CLIENT_SECRET
  #     scopes: [https://<instance>.service-now.com/.default]

redaction:
  # Omit builtins to enable the full default set. windows_account is opt-in.
  builtins:
    - private_key
    - jwt
    - aws_access_key
    - azure_key
    - vendor_token
    - url_credentials
    - bearer_token
    - secret_assignment
    - email
    - us_ssn
    - credit_card
    - phone_us
    - date_of_birth
  blocked_key_patterns: ["(?i).*ssn.*", "(?i).*password.*", "(?i).*dob.*"]
  custom:
    - name: member_id
      regex: "\\bMET[0-9]{9}\\b"
    # Internal hostnames, if MetLife wants topology masked too:
    # - name: internal_host
    #   regex: "\\b[a-z0-9-]+\\.corp\\.metlife\\.com\\b"
  allowed_values: ["(?i)[a-z0-9._-]+@metlife\\.com"]
  mask: label   # or hmac, keyed by REDACTION_HMAC_KEY
