# neubird-proxy configuration. Mounted from a ConfigMap; secrets are
# referenced by environment variable name and come from a Kubernetes Secret.
# Hostnames, allowlists and the member_id pattern are placeholders for
# MetLife to confirm.

listen: ":8443"          # NeuBird-facing listener (exposed via the load balancer)
admin_listen: ":9090"    # /healthz, /readyz, /metrics (cluster-internal only)

# Optional: terminate TLS in the pod. Omit if the load balancer terminates.
# With client_ca_file, NeuBird must also present a client certificate from
# that CA (mutual TLS), in addition to the token.
# tls:
#   cert_file: /etc/neubird-proxy/tls/tls.crt
#   key_file: /etc/neubird-proxy/tls/tls.key
#   client_ca_file: /etc/neubird-proxy/tls/neubird-client-ca.crt

# Optional: extra CA bundle for internal certificates on your systems.
# upstream_ca_file: /etc/neubird-proxy/ca/ca.crt

# The token NeuBird sends (32+ characters); checked, then removed.
client_token_env: NEUBIRD_PROXY_TOKEN
# During a rotation, the outgoing token is accepted too. Remove afterwards.
# client_token_previous_env: NEUBIRD_PROXY_TOKEN_PREVIOUS

max_body_bytes: 20971520      # 20 MiB; larger bodies are refused (502), never passed through
max_concurrent_requests: 256  # beyond this, 503
max_concurrent_buffered: 4    # and memory is budgeted from the container's limit (README: Latency and capacity)

# NeuBird names the destination host of each request (the endpoint URL of
# its connection) and sends that system's credentials; the proxy checks the
# host against these patterns, then redacts the response. Hostnames are
# placeholders for MetLife to confirm.
neubird_destinations:
  # Optional; omitted means any host name. "*.domain", "host[:port]", or an
  # exact IP address (wildcards never match IPs).
  hosts:
    - "*.apis.metlife.com"
    - "maestro.corp.metlife.com"
  # A ceiling for every destination: Splunk search jobs and MCP need POST,
  # MCP sessions end with DELETE.
  methods: [GET, HEAD, POST, DELETE]
  # The headers NeuBird may set for the destination, sent as
  # X-Neubird-Upstream-<Header>. Here the backend's token and the APIM
  # subscription key.
  credential_headers: [Authorization, Ocp-Apim-Subscription-Key]
  # SPL commands that write, send, delete or reach other systems.
  request_deny_patterns:
    - "(?i)\\|\\s*(sendemail|sendalert|outputlookup|outputcsv|outputtext|collect|mcollect|meventcollect|tscollect|delete|script|run|runshellscript|map|rest|dbxoutput|dbxquery|sendresults)\\b"
  rate_limit: {requests_per_second: 10, burst: 30}
  # Optional JSON field allowlist, applied to every destination's responses:
  # every other string or number becomes [REDACTED:FIELD].
  # response_fields: [result.sys_id, result.number, result.state]

redaction:
  # Omit builtins to enable the full default set. windows_account is opt-in.
  builtins:
    - private_key
    - jwt
    - aws_access_key
    - azure_key
    - vendor_token
    - url_credentials
    - bearer_token
    - secret_assignment
    - email
    - us_ssn
    - credit_card
    - phone_us
    - date_of_birth
  blocked_key_patterns: ["(?i).*ssn.*", "(?i).*password.*", "(?i).*dob.*"]
  custom:
    - name: member_id
      regex: "\\bMET[0-9]{9}\\b"
    # Internal hostnames, if MetLife wants topology masked too:
    # - name: internal_host
    #   regex: "\\b[a-z0-9-]+\\.corp\\.metlife\\.com\\b"
  allowed_values: ["(?i)[a-z0-9._-]+@metlife\\.com"]
  mask: label   # or hmac, keyed by REDACTION_HMAC_KEY
