# neubird-proxy chart values. Required: image, and for mode tunnel (the
# default) tunnel and relayCA; for mode inbound, inbound.tls and env.
#
# A package from NeuBird ships <tenant>-values.yaml with all of that set, so
# the first install is:
#   helm install neubird-proxy neubird-proxy-<version>.tgz -n neubird --create-namespace \
#     -f <tenant>-values.yaml --set-file joinToken=join.token --wait
#   helm test neubird-proxy -n neubird

# The image is shipped to you separately: load it into your registry and
# point here, by digest (preferred) or tag.
image:
  repository: ""          # e.g. registry.example.com/neubird/neubird-proxy
  digest: ""              # sha256:...
  tag: ""                 # used only when digest is empty
  pullPolicy: IfNotPresent
imagePullSecrets: []      # [{name: my-registry-creds}]

replicaCount: 2

# How requests reach the proxy.
#   tunnel:  the proxy dials out to your NeuBird relay; nothing connects in.
#   inbound: the proxy listens on a Service (port 8443) behind something you
#            run, such as an API gateway in front of your systems. No tunnel,
#            relay CA or tunnel key; tunnel, relayCA and tunnelKey are unused.
mode: tunnel

# mode: inbound only.
inbound:
  # TLS on the listener: a kubernetes.io/tls Secret (tls.crt, tls.key).
  # Required unless allowPlainHTTP. The proxy re-reads it (and clientCA)
  # every minute, so a renewal needs no restart.
  tls:
    existingSecret: ""
  # Mutual TLS: only clients presenting a certificate this CA signed (your
  # gateway's client certificate) get through, in addition to the token.
  clientCA:
    cert: ""                # PEM bundle, or:
    existingConfigMap: ""   # a ConfigMap with key ca.crt
  # Plain HTTP on the listener, only when TLS ends in front of the pod
  # (a service-mesh sidecar). The proxy logs a warning at startup.
  allowPlainHTTP: false
  service:
    type: ClusterIP         # or LoadBalancer, with an internal-LB annotation
    port: 8443
    annotations: {}         # e.g. service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    loadBalancerSourceRanges: []

# mode: tunnel only. Your dedicated relay, from NeuBird.
tunnel:
  relays: []              # ["<tenant>.tunnel.neubird.ai:443"]
  tenant: ""              # your NeuBird tenant
  proxy: ""               # a name for this deployment, e.g. aks-prod
  connectionsPerRelay: 2  # tunnels per replica; NeuBird monitors replicas × this
  # The env var holding the join token (joinToken below, or your
  # env.existingSecret). With it, the proxy enrolls its own key on first
  # connect: nothing to send back. Without one, send NeuBird the key's
  # fingerprint.
  joinTokenEnv: NEUBIRD_JOIN_TOKEN

# The join token NeuBird gave you, for the first install:
# --set-file joinToken=join.token. Single use; once the key is enrolled it's
# spent, and an upgrade without it drops it. Used when env.existingSecret is
# empty (the chart's own Secret, below).
joinToken: ""

# hmac masking (config.redaction.mask: hmac) with the chart's own Secret: the
# key is generated at install and kept across upgrades and reinstalls, so the
# masking codes stay the same. Set it yourself only where the chart can't see
# the existing Secret (helm template, Argo CD), or every render would make a
# new key and change the codes.
hmacKey: ""

# The relay CA certificate NeuBird sends you (public). The proxy only
# connects to a relay whose certificate this CA signed.
relayCA:
  cert: ""                # the PEM itself, or:
  existingConfigMap: ""   # a ConfigMap with key relay-ca.crt

# Optional: extra CA certificates to trust for your upstreams (e.g. an API
# gateway with an internal certificate), added to the public ones. Sets
# upstream_ca_file. Read at startup: a change to `cert` rolls the pods; after
# changing an existingConfigMap, run kubectl rollout restart.
upstreamCA:
  cert: ""                # PEM bundle, or:
  existingConfigMap: ""   # a ConfigMap with key ca.crt

# The proxy's tunnel key: its identity. It never leaves your cluster; you
# send NeuBird only its fingerprint (see the install notes).
tunnelKey:
  # Generate a P-256 key in a Secret at install, kept across upgrades and
  # left in place on uninstall. With `helm template` or Argo CD, generate it
  # yourself (neubird-proxy keygen) and use existingSecret: they can't see
  # the existing Secret, so every render would replace the key (dropping the
  # tunnels), and the key would land in your rendered YAML.
  generate: true
  existingSecret: ""      # a Secret with key tunnel.key

# The proxy's secret environment: NEUBIRD_JOIN_TOKEN (until the key is
# enrolled), REDACTION_HMAC_KEY if config.redaction uses hmac, and
# NEUBIRD_PROXY_TOKEN when client_auth needs a token (always in mode inbound:
# the token your gateway sends). Mode tunnel needs no proxy token: every
# request comes down the proxy's own tunnel (client_auth: none).
#
# Empty (mode tunnel with client_auth none): the chart creates Secret
# <fullname>-env from joinToken and hmacKey (kept on uninstall, so a
# reinstall keeps the masking codes). Otherwise name a Secret you create.
env:
  existingSecret: ""

# Extra, non-secret environment for the proxy container (EnvVar list). For an
# outbound HTTP proxy between the proxy and the internet:
#   - {name: HTTPS_PROXY, value: "http://egress-proxy.corp.example:3128"}
#   - {name: NO_PROXY, value: ".corp.example,10.0.0.0/8"}
# The tunnel to the relay and any system not in NO_PROXY then go through it
# (a plain HTTP proxy is fine; one that inspects TLS breaks the tunnel's mTLS).
# Allow the egress proxy in networkPolicy.upstreams too.
extraEnv: []

# The proxy's configuration (docs/configuration.md): the hosts NeuBird may
# reach (neubird_destinations), redaction, limits. The chart sets the rest:
# admin_listen: :9090, and either the tunnel section (from `tunnel` above)
# with listen: off, or (mode inbound) listen: :8443 and tls (from
# `inbound`). ${VAR} placeholders are filled from env.
config:
  # The proxy token's variable: used in mode inbound (the chart leaves it out
  # in mode tunnel, where client_auth defaults to none).
  client_token_env: NEUBIRD_PROXY_TOKEN
  # neubird_destinations:
  #   hosts: ["*.corp.example.com"]   # optional; omitted means any host name
  #   client_auth: none               # the default in mode tunnel; set bearer to require a token
  # redaction:
  #   mask: hmac
  #   hmac_key_env: REDACTION_HMAC_KEY

resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {memory: 512Mi}  # the proxy sizes its request buffers from this

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Off by default. When on: inbound only metricsFrom on 9090, and (mode
# inbound) inboundFrom on 8443; outbound only DNS, the relays (relayCIDRs on
# relayPorts, mode tunnel) and your systems (upstreams, which must also cover
# an outbound HTTP proxy if extraEnv sets one).
networkPolicy:
  enabled: false
  relayCIDRs: []           # mode tunnel: NeuBird's relay IPs (or CIDRs), e.g. ["203.0.113.10"]
  relayPorts: [443]        # mode tunnel: the relays' port(s)
  inboundFrom: []          # mode inbound: NetworkPolicyPeers allowed to reach 8443, e.g. [{ipBlock: {cidr: 10.30.0.0/24}}]
  upstreams: []            # [{cidr: 10.20.0.0/16, ports: [443]}]; a bare IP is that one address
  metricsFrom: []          # NetworkPolicyPeers allowed to scrape :9090
  dnsPeers:                # where DNS is answered
    - namespaceSelector: {}
      podSelector:
        matchLabels: {k8s-app: kube-dns}

serviceAccount:
  create: true
  name: ""

podAnnotations: {}
podLabels: {}
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
