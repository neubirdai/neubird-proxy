# Used by CI (make chart-check): a complete tunnel-only install. The relay
# CA is passed with --set-file relayCA.cert=<a test CA>.
image:
  repository: registry.example.com/neubird/neubird-proxy
  digest: sha256:ad40087a2605f1a181352782a112399e3f1b81fb26c6933684205bc6853eb46d
tunnel:
  relays: ["acme.tunnel.neubird.ai:443"]
  tenant: acme
  proxy: aks-prod
env:
  existingSecret: neubird-proxy-env
config:
  client_token_env: NEUBIRD_PROXY_TOKEN
  neubird_destinations:
    hosts: ["*.example.com", "splunk.example.com:8089"]
    methods: [GET, POST]
    request_deny_patterns:
      - "(?i)\\|\\s*(sendemail|sendalert|outputlookup|outputcsv|collect|delete|script|run|map|dbxquery)\\b"
  redaction:
    mask: hmac
    hmac_key_env: REDACTION_HMAC_KEY
networkPolicy:
  enabled: true
  relayCIDRs: ["203.0.113.10/32"]
  upstreams: [{cidr: 10.20.0.0/16, ports: [8089]}]
