apiVersion: v2
name: neubird-proxy
description: >-
  NeuBird's customer-side proxy. Runs in your cluster, opens outbound mTLS
  tunnels to your dedicated NeuBird relay, and serves NeuBird's requests to
  your internal APIs through allow-listed, redacted connections. No inbound
  port.
type: application
version: 1.0.0
appVersion: "cc97e4f"
kubeVersion: ">=1.25.0-0"
home: https://neubird.ai
