# Example values. Copy, then replace every CHANGE_ME.
image:
  repository: CHANGE_ME.registry.example.com/neubird/neubird-proxy
  digest: sha256:CHANGE_ME          # from NeuBird's release notes

tunnel:
  relays: ["CHANGE_ME.tunnel.neubird.ai:443"]   # from NeuBird
  tenant: CHANGE_ME                             # from NeuBird
  proxy: aks-prod                               # your name for this deployment

# relayCA: pass the file NeuBird sent: --set-file relayCA.cert=relay-ca.crt

# Secret neubird-proxy-env, created by you (or your secret store) with:
#   NEUBIRD_JOIN_TOKEN      the join token from NeuBird (enrolls the key; removable after)
#   REDACTION_HMAC_KEY      openssl rand -hex 32 (only with mask: hmac)
# No proxy token: requests come down the proxy's own tunnel (client_auth: none).
env:
  existingSecret: neubird-proxy-env

config:
  max_body_bytes: 20971520
  # NeuBird names the host of each request (its connection's URL) and sends
  # that system's credentials; only hosts matching these patterns are reached.
  neubird_destinations:
    hosts: ["*.CHANGE_ME.example.com"]   # optional; omitted means any host name
    methods: [GET, HEAD, POST]   # Splunk MCP needs POST; its session DELETE gets a harmless 405
    # The headers NeuBird may set for a system: its token, and here an API
    # gateway's subscription key.
    credential_headers: [Authorization, Ocp-Apim-Subscription-Key]
    # SPL commands that write, send, delete or reach other systems.
    request_deny_patterns:
      - "(?i)\\|\\s*(sendemail|sendalert|outputlookup|outputcsv|outputtext|collect|mcollect|meventcollect|tscollect|delete|script|run|runshellscript|map|rest|dbxoutput|dbxquery|sendresults)\\b"
    rate_limit: {requests_per_second: 10, burst: 30}
  redaction:                    # all default detectors (secrets, email, SSN, cards, phone, IPv4, DOB), plus:
    custom:
      - name: member_id
        regex: "\\bCHANGE_ME[0-9]{9}\\b"
    mask: hmac                  # same value -> same token, so events still correlate
    hmac_key_env: REDACTION_HMAC_KEY

networkPolicy:
  enabled: true
  relayCIDRs: ["CHANGE_ME/32"]                    # NeuBird's relay addresses
  upstreams: [{cidr: CHANGE_ME/24, ports: [443]}] # the systems NeuBird may reach
