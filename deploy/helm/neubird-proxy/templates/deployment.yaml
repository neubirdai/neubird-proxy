{{- if not .Values.env.existingSecret }}{{ fail "env.existingSecret is required: a Secret with NEUBIRD_PROXY_TOKEN (unless client_auth: none) and your connections' credentials" }}{{ end }}
{{- $inbound := include "neubird-proxy.inbound" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "neubird-proxy.fullname" . }}
  labels: {{- include "neubird-proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "neubird-proxy.selectorLabels" . | nindent 6 }}
  strategy:
    # A new replica must be ready (with a tunnel up, in mode tunnel) before
    # an old one goes.
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels:
        {{- include "neubird-proxy.selectorLabels" . | nindent 8 }}
        # What `neubird-proxy netpol` policies select (its -app flag).
        app: {{ include "neubird-proxy.name" . }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      annotations:
        checksum/config: {{ include "neubird-proxy.config" . | sha256sum }}
        checksum/relay-ca: {{ .Values.relayCA.cert | sha256sum }}
        {{- if $inbound }}
        checksum/client-ca: {{ .Values.inbound.clientCA.cert | sha256sum }}
        {{- end }}
        checksum/upstream-ca: {{ .Values.upstreamCA.cert | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{ end }}
    spec:
      serviceAccountName: {{ include "neubird-proxy.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "neubird-proxy.selectorLabels" . | nindent 14 }}
      containers:
        - name: proxy
          image: {{ include "neubird-proxy.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [-config, /etc/neubird-proxy/config.yaml]
          envFrom:
            - secretRef: {name: {{ .Values.env.existingSecret }}}
          ports:
            {{- if $inbound }}
            - {name: proxy, containerPort: 8443}
            {{- end }}
            - {name: admin, containerPort: 9090}
          # Ready only once serving (in mode tunnel, with a tunnel up), so a
          # rollout with a bad key, CA or certificate stops before it
          # replaces working replicas.
          readinessProbe:
            httpGet: {path: /readyz, port: admin}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: admin}
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
          # The user repeats the pod's: admission policies (OPA Gatekeeper,
          # Kyverno) may check each container's own securityContext.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/neubird-proxy/config.yaml, subPath: config.yaml, readOnly: true}
            {{- if $inbound }}
            {{- if .Values.inbound.tls.existingSecret }}
            - {name: tls, mountPath: /etc/neubird-proxy/tls, readOnly: true}
            {{- end }}
            {{- if include "neubird-proxy.hasClientCA" . }}
            - {name: client-ca, mountPath: /etc/neubird-proxy/client-ca, readOnly: true}
            {{- end }}
            {{- else }}
            - {name: tunnel, mountPath: /etc/neubird-proxy/tunnel, readOnly: true}
            - {name: ca, mountPath: /etc/neubird-proxy/ca, readOnly: true}
            {{- end }}
            {{- if or .Values.upstreamCA.cert .Values.upstreamCA.existingConfigMap }}
            - {name: upstream-ca, mountPath: /etc/neubird-proxy/upstream-ca, readOnly: true}
            {{- end }}
      volumes:
        - name: config
          configMap: {name: {{ include "neubird-proxy.fullname" . }}}
        {{- if $inbound }}
        {{- with .Values.inbound.tls.existingSecret }}
        - name: tls
          secret:
            secretName: {{ . }}
            items: [{key: tls.crt, path: tls.crt}, {key: tls.key, path: tls.key}]
            defaultMode: 0440   # group-readable through fsGroup
        {{- end }}
        {{- if include "neubird-proxy.hasClientCA" . }}
        - name: client-ca
          configMap:
            name: {{ include "neubird-proxy.clientCAConfigMap" . }}
            items: [{key: ca.crt, path: ca.crt}]
        {{- end }}
        {{- else }}
        - name: tunnel
          secret:
            secretName: {{ include "neubird-proxy.keySecret" . }}
            items: [{key: tunnel.key, path: tunnel.key}]
            defaultMode: 0440   # group-readable through fsGroup
        - name: ca
          configMap:
            name: {{ include "neubird-proxy.caConfigMap" . }}
            items: [{key: relay-ca.crt, path: relay-ca.crt}]
        {{- end }}
        {{- if or .Values.upstreamCA.cert .Values.upstreamCA.existingConfigMap }}
        - name: upstream-ca
          configMap:
            name: {{ include "neubird-proxy.upstreamCAConfigMap" . }}
            items: [{key: ca.crt, path: ca.crt}]
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
