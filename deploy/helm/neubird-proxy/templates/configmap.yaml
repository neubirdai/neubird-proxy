apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "neubird-proxy.fullname" . }}
  labels: {{- include "neubird-proxy.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- include "neubird-proxy.config" . | nindent 4 }}
{{- if and .Values.relayCA.cert (not .Values.relayCA.existingConfigMap) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "neubird-proxy.caConfigMap" . }}
  labels: {{- include "neubird-proxy.labels" . | nindent 4 }}
data:
  relay-ca.crt: |
    {{- .Values.relayCA.cert | trim | nindent 4 }}
{{- end }}
{{- if and .Values.upstreamCA.cert (not .Values.upstreamCA.existingConfigMap) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "neubird-proxy.upstreamCAConfigMap" . }}
  labels: {{- include "neubird-proxy.labels" . | nindent 4 }}
data:
  ca.crt: |
    {{- .Values.upstreamCA.cert | trim | nindent 4 }}
{{- end }}
