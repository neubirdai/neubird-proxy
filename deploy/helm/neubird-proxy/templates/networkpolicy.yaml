{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- if not $np.relayCIDRs }}{{ fail "networkPolicy.relayCIDRs is required when networkPolicy.enabled: NeuBird's relay addresses" }}{{ end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "neubird-proxy.fullname" . }}
  labels: {{- include "neubird-proxy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "neubird-proxy.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  # The proxy only dials out; nothing connects to it except metrics scrapers.
  ingress:
    {{- if $np.metricsFrom }}
    - from: {{- toYaml $np.metricsFrom | nindent 8 }}
      ports: [{port: 9090, protocol: TCP}]
    {{- else }} []
    {{- end }}
  egress:
    - to: {{- toYaml $np.dnsPeers | nindent 8 }}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        {{- range $np.relayCIDRs }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      ports: [{port: 443, protocol: TCP}]
    {{- range $np.upstreams }}
    - to: [{ipBlock: {cidr: {{ .cidr }}}}]
      ports:
        {{- range .ports }}
        - {port: {{ . }}, protocol: TCP}
        {{- end }}
    {{- end }}
{{- end }}
