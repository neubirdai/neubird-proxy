{{- /* helm test <release>: the proxy's own check from a pod with the same
config, key, CA and environment: the tunnel (mutual TLS accepted by the
relay) and each listed host (DNS, TCP, TLS). No request is sent. Kept after
it runs: kubectl logs <release>-test shows the result. */}}
{{- if not (include "neubird-proxy.inbound" .) }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "neubird-proxy.fullname" . }}-test
  labels:
    {{- include "neubird-proxy.labels" . | nindent 4 }}
    # The proxy's NetworkPolicy selects these labels, so the test gets the
    # same egress as the proxy.
    app: {{ include "neubird-proxy.name" . }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  serviceAccountName: {{ include "neubird-proxy.serviceAccountName" . }}
  automountServiceAccountToken: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets: {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: test
      image: {{ include "neubird-proxy.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: [/neubird-proxy]
      args: [test, -config, /etc/neubird-proxy/config.yaml{{ range splitList " " (include "neubird-proxy.testURLs" .) }}{{ if . }}, {{ . | quote }}{{ end }}{{ end }}]
      envFrom:
        - secretRef: {name: {{ include "neubird-proxy.envSecret" . }}}
      {{- with .Values.extraEnv }}
      env: {{- toYaml . | nindent 8 }}
      {{- end }}
      resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      volumeMounts:
        - {name: config, mountPath: /etc/neubird-proxy/config.yaml, subPath: config.yaml, readOnly: true}
        - {name: tunnel, mountPath: /etc/neubird-proxy/tunnel, readOnly: true}
        - {name: ca, mountPath: /etc/neubird-proxy/ca, readOnly: true}
        {{- if or .Values.upstreamCA.cert .Values.upstreamCA.existingConfigMap }}
        - {name: upstream-ca, mountPath: /etc/neubird-proxy/upstream-ca, readOnly: true}
        {{- end }}
  volumes:
    - name: config
      configMap: {name: {{ include "neubird-proxy.fullname" . }}}
    - name: tunnel
      secret:
        secretName: {{ include "neubird-proxy.keySecret" . }}
        items: [{key: tunnel.key, path: tunnel.key}]
        defaultMode: 0440
    - name: ca
      configMap:
        name: {{ include "neubird-proxy.caConfigMap" . }}
        items: [{key: relay-ca.crt, path: relay-ca.crt}]
    {{- if or .Values.upstreamCA.cert .Values.upstreamCA.existingConfigMap }}
    - name: upstream-ca
      configMap:
        name: {{ include "neubird-proxy.upstreamCAConfigMap" . }}
        items: [{key: ca.crt, path: ca.crt}]
    {{- end }}
  {{- with .Values.nodeSelector }}
  nodeSelector: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.tolerations }}
  tolerations: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
