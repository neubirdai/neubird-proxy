{{- if and .Values.tunnelKey.generate (not .Values.tunnelKey.existingSecret) }}
{{- $name := include "neubird-proxy.keySecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "neubird-proxy.labels" . | nindent 4 }}
  annotations:
    # The key is the proxy's identity at the relay: never replace or delete
    # it by accident (a new key needs its fingerprint recorded again).
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data "tunnel.key") }}
  tunnel.key: {{ index $existing.data "tunnel.key" }}
  {{- else }}
  tunnel.key: {{ genPrivateKey "ecdsa" | b64enc }}
  {{- end }}
{{- end }}
