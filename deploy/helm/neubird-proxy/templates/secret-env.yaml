{{- /* The proxy's env Secret when you don't bring one (env.existingSecret):
the join token, and a generated hmac masking key. Kept on uninstall, like
the tunnel key, so a reinstall keeps the masking codes. */}}
{{- if not .Values.env.existingSecret }}
{{- $name := include "neubird-proxy.envSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- with include "neubird-proxy.joinToken" . }}
{{- $_ := set $data $.Values.tunnel.joinTokenEnv (b64enc .) }}
{{- end }}
{{- $redaction := get (.Values.config | default dict) "redaction" | default dict }}
{{- if eq (get $redaction "mask" | default "") "hmac" }}
{{- $env := get $redaction "hmac_key_env" | default "REDACTION_HMAC_KEY" }}
{{- if .Values.hmacKey }}
{{- $_ := set $data $env (b64enc .Values.hmacKey) }}
{{- else if and $existing $existing.data (index $existing.data $env) }}
{{- $_ := set $data $env (index $existing.data $env) }}
{{- else }}
{{- $_ := set $data $env (randAlphaNum 64 | b64enc) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "neubird-proxy.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data: {{- if $data }}{{ toYaml $data | nindent 2 }}{{ else }} {}{{ end }}
{{- end }}
