# neubird-proxy at MetLife: Helm values for tunnel mode. The proxy dials out to
# MetLife's NeuBird relay and calls MetLife's APIM, which fronts Splunk.
# Replace every <...>. See README.md.
#
#   helm install neubird-proxy ./neubird-proxy -n neubird -f values.yaml \
#     --set-file relayCA.cert=relay-ca.crt --set-file upstreamCA.cert=metlife-ca.pem

image:
  repository: <your-acr>.azurecr.io/neubird/neubird-proxy
  digest: sha256:<from NeuBird's release notes>
replicaCount: 2

mode: tunnel
tunnel:
  relays: ["<tenant>.tunnel.neubird.ai:443"]   # from NeuBird
  tenant: <tenant>                             # from NeuBird
  proxy: aks-prod                              # your name for this deployment
  connectionsPerRelay: 2
  joinTokenEnv: NEUBIRD_JOIN_TOKEN             # enrolls the key on first connect

# relayCA (NeuBird's, public) and upstreamCA (the CA that signs
# int.apis.metlife.com) are passed with --set-file, as above.

# Generated in a Secret at install and kept. With helm template / GitOps, make
# the key with `neubird-proxy keygen` and set existingSecret instead.
tunnelKey:
  generate: true

# Secret neubird-proxy-env: NEUBIRD_PROXY_TOKEN, APIM_SUBSCRIPTION_KEY,
# REDACTION_HMAC_KEY (32+ characters) and NEUBIRD_JOIN_TOKEN.
env:
  existingSecret: neubird-proxy-env

# Outbound HTTP proxy, if internet traffic must use one. Allow it in
# networkPolicy.upstreams below.
extraEnv: []
#  - {name: HTTPS_PROXY, value: "http://<egress-proxy>:3128"}
#  - {name: NO_PROXY, value: ".metlife.com"}

config:
  client_token_env: NEUBIRD_PROXY_TOKEN
  max_body_bytes: 20971520
  connections:
    # Splunk behind MetLife's APIM. The proxy adds the subscription key;
    # NeuBird never holds it.
    - name: splunk
      upstream: https://int.apis.metlife.com/<splunk api path>
      client_auth: bearer
      methods: [GET, POST]
      paths:
        - /services/search/jobs
        - /services/search/jobs/[A-Za-z0-9._-]+(/(results|control))?
        - /services/data/indexes
        - /services/server/info
        - /services/mcp
      headers:
        Ocp-Apim-Subscription-Key: ${APIM_SUBSCRIPTION_KEY}
      # SPL commands that write, send, delete or reach other systems.
      request_deny_patterns:
        - "(?i)\\|\\s*(sendemail|sendalert|outputlookup|outputcsv|outputtext|collect|mcollect|meventcollect|tscollect|delete|script|run|runshellscript|map|rest|dbxoutput|dbxquery|sendresults)\\b"
      rate_limit: {requests_per_second: 5, burst: 20}
  redaction:
    custom:
      - name: member_id
        regex: "\\bMET[0-9]{9}\\b"
    mask: hmac
    hmac_key_env: REDACTION_HMAC_KEY

networkPolicy:
  enabled: true
  relayCIDRs: ["<relay IP>/32"]            # from NeuBird
  relayPorts: [443]
  upstreams:
    - {cidr: <APIM range>, ports: [443]}
    # - {cidr: <egress proxy>/32, ports: [3128]}

resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {memory: 512Mi}
