# neubird-proxy at MetLife, tunnel mode: the proxy dials out to NeuBird's
# relay; nothing connects in. install.sh builds the values from this file.
#
#   helm install neubird-proxy ./neubird-proxy -n neubird -f values.yaml \
#     --set-file relayCA.cert=relay-ca.crt

image:
  repository: docker.io/neubirdai/neubird-proxy
  digest: sha256:78197d45a38c2ac25cacc6973a6af56c443345902258e543652ffa51f12a139b   # cc97e4f: needs no tenant or proxy name (relays from neubird-relay #30)

# Only what differs from the chart's defaults (mode tunnel, 2 replicas,
# joinTokenEnv NEUBIRD_JOIN_TOKEN, NetworkPolicy off) and the proxy's
# (max_body_bytes 20 MiB, hmac_key_env REDACTION_HMAC_KEY).
tunnel:
  relays: ["metlife-tunnel.cluster.neubird.ai:443"]
  # No tenant or proxy: the relay knows the proxy by its key (by the join
  # token's record on first connect).

env:
  existingSecret: neubird-proxy-env   # REDACTION_HMAC_KEY; NEUBIRD_JOIN_TOKEN until enrolled

# 768Mi fits 20 MiB responses (max_body_bytes).
resources:
  limits: {memory: 768Mi}

config:
  neubird_destinations:
    hosts: ["*"]                  # any host name; limit egress at the network
    methods: ["*"]
    # SPL commands that write, send or reach other systems.
    request_deny_patterns:
      - "(?i)\\|\\s*(sendemail|sendalert|outputlookup|outputcsv|outputtext|collect|mcollect|meventcollect|tscollect|delete|script|run|runshellscript|map|rest|dbxoutput|dbxquery|sendresults)\\b"
    rate_limit: {requests_per_second: 10, burst: 30}
  redaction:
    mask: hmac                    # or label (no key)

# The NetworkPolicy is off; install.sh --allow-cidrs turns it on (and adds the
# relay's IPs).
