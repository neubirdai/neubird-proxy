name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned by commit SHA, not tag, so a moved tag cannot change
# what runs here.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Vulnerabilities
        run: make vuln
      - name: Fuzz
        run: make fuzz FUZZTIME=30s
      - name: Example config is valid
        run: make check-config
      - name: Helm chart
        run: make chart-check

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: make image VERSION=${{ github.sha }}
      - name: Image size
        run: docker image ls neubird-proxy:${{ github.sha }} --format '{{.Size}}'
      - name: SBOM
        run: make sbom VERSION=${{ github.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.spdx.json
